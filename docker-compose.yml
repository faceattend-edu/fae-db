name: fae-db

services:
  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    container_name: fae-postgres
    mem_limit: 1g
    cpus: "1.0"
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-faceattend_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-faceattend_db}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - fae-data

  identity-liquibase:
    image: ${FACEATTEND_LIQUIBASE_IMAGE:-liquibase/liquibase:4.29.0@sha256:cfffa8fe6e2fa01416888cb4d783250c6a100b4c96f32d23dec3b1ff6c8c3b2d}
    container_name: fae-identity-liquibase
    mem_limit: 256m
    cpus: "0.5"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./01-ms-identity-db:/liquibase/project
    command:
      - --searchPath=/liquibase/project
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-faceattend_db}
      - --username=${POSTGRES_USER:-postgres}
      - --password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - --contexts=${LIQUIBASE_CONTEXTS:-seed}
      - --changeLogFile=changelog/changelog-master.yaml
      - update
    networks:
      - fae-data

  authorization-liquibase:
    image: ${FACEATTEND_LIQUIBASE_IMAGE:-liquibase/liquibase:4.29.0@sha256:cfffa8fe6e2fa01416888cb4d783250c6a100b4c96f32d23dec3b1ff6c8c3b2d}
    container_name: fae-authorization-liquibase
    mem_limit: 256m
    cpus: "0.5"
    depends_on:
      postgres:
        condition: service_healthy
      identity-liquibase:
        condition: service_completed_successfully
    volumes:
      - ./02-ms-authorization-db:/liquibase/project
    command:
      - --searchPath=/liquibase/project
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-faceattend_db}
      - --username=${POSTGRES_USER:-postgres}
      - --password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - --contexts=${LIQUIBASE_CONTEXTS:-seed}
      - --changeLogFile=changelog/changelog-master.yaml
      - update
    networks:
      - fae-data

  academic-liquibase:
    image: ${FACEATTEND_LIQUIBASE_IMAGE:-liquibase/liquibase:4.29.0@sha256:cfffa8fe6e2fa01416888cb4d783250c6a100b4c96f32d23dec3b1ff6c8c3b2d}
    container_name: fae-academic-liquibase
    mem_limit: 256m
    cpus: "0.5"
    depends_on:
      postgres:
        condition: service_healthy
      authorization-liquibase:
        condition: service_completed_successfully
    volumes:
      - ./03-ms-academic-db:/liquibase/project
    command:
      - --searchPath=/liquibase/project
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-faceattend_db}
      - --username=${POSTGRES_USER:-postgres}
      - --password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - --contexts=${LIQUIBASE_CONTEXTS:-seed}
      - --changeLogFile=changelog/changelog-master.yaml
      - update
    networks:
      - fae-data

  scheduling-liquibase:
    image: ${FACEATTEND_LIQUIBASE_IMAGE:-liquibase/liquibase:4.29.0@sha256:cfffa8fe6e2fa01416888cb4d783250c6a100b4c96f32d23dec3b1ff6c8c3b2d}
    container_name: fae-scheduling-liquibase
    mem_limit: 256m
    cpus: "0.5"
    depends_on:
      postgres:
        condition: service_healthy
      academic-liquibase:
        condition: service_completed_successfully
    volumes:
      - ./04-ms-scheduling-db:/liquibase/project
    command:
      - --searchPath=/liquibase/project
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-faceattend_db}
      - --username=${POSTGRES_USER:-postgres}
      - --password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - --contexts=${LIQUIBASE_CONTEXTS:-seed}
      - --changeLogFile=changelog/changelog-master.yaml
      - update
    networks:
      - fae-data

  attendance-liquibase:
    image: ${FACEATTEND_LIQUIBASE_IMAGE:-liquibase/liquibase:4.29.0@sha256:cfffa8fe6e2fa01416888cb4d783250c6a100b4c96f32d23dec3b1ff6c8c3b2d}
    container_name: fae-attendance-liquibase
    mem_limit: 256m
    cpus: "0.5"
    depends_on:
      postgres:
        condition: service_healthy
      scheduling-liquibase:
        condition: service_completed_successfully
    volumes:
      - ./05-ms-attendance-db:/liquibase/project
    command:
      - --searchPath=/liquibase/project
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-faceattend_db}
      - --username=${POSTGRES_USER:-postgres}
      - --password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - --contexts=${LIQUIBASE_CONTEXTS:-seed}
      - --changeLogFile=changelog/changelog-master.yaml
      - update
    networks:
      - fae-data

  biometric-liquibase:
    image: ${FACEATTEND_LIQUIBASE_IMAGE:-liquibase/liquibase:4.29.0@sha256:cfffa8fe6e2fa01416888cb4d783250c6a100b4c96f32d23dec3b1ff6c8c3b2d}
    container_name: fae-biometric-liquibase
    mem_limit: 256m
    cpus: "0.5"
    depends_on:
      postgres:
        condition: service_healthy
      attendance-liquibase:
        condition: service_completed_successfully
    volumes:
      - ./06-ms-biometric-db:/liquibase/project
    command:
      - --searchPath=/liquibase/project
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-faceattend_db}
      - --username=${POSTGRES_USER:-postgres}
      - --password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - --contexts=${LIQUIBASE_CONTEXTS:-seed}
      - --changeLogFile=changelog/changelog-master.yaml
      - update
    networks:
      - fae-data

  configuration-liquibase:
    image: ${FACEATTEND_LIQUIBASE_IMAGE:-liquibase/liquibase:4.29.0@sha256:cfffa8fe6e2fa01416888cb4d783250c6a100b4c96f32d23dec3b1ff6c8c3b2d}
    container_name: fae-configuration-liquibase
    mem_limit: 256m
    cpus: "0.5"
    depends_on:
      postgres:
        condition: service_healthy
      biometric-liquibase:
        condition: service_completed_successfully
    volumes:
      - ./07-ms-configuration-db:/liquibase/project
    command:
      - --searchPath=/liquibase/project
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-faceattend_db}
      - --username=${POSTGRES_USER:-postgres}
      - --password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - --contexts=${LIQUIBASE_CONTEXTS:-seed}
      - --changeLogFile=changelog/changelog-master.yaml
      - update
    networks:
      - fae-data

  notification-liquibase:
    image: ${FACEATTEND_LIQUIBASE_IMAGE:-liquibase/liquibase:4.29.0@sha256:cfffa8fe6e2fa01416888cb4d783250c6a100b4c96f32d23dec3b1ff6c8c3b2d}
    container_name: fae-notification-liquibase
    mem_limit: 256m
    cpus: "0.5"
    depends_on:
      postgres:
        condition: service_healthy
      configuration-liquibase:
        condition: service_completed_successfully
    volumes:
      - ./08-ms-notification-db:/liquibase/project
    command:
      - --searchPath=/liquibase/project
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-faceattend_db}
      - --username=${POSTGRES_USER:-postgres}
      - --password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - --contexts=${LIQUIBASE_CONTEXTS:-seed}
      - --changeLogFile=changelog/changelog-master.yaml
      - update
    networks:
      - fae-data

  db-service-logins:
    image: postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
    container_name: fae-db-service-logins
    depends_on:
      postgres:
        condition: service_healthy
      notification-liquibase:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PSQL: psql -h postgres -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-faceattend_db}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD is required}
      AUTHORIZATION_DB_PASSWORD: ${AUTHORIZATION_DB_PASSWORD:?AUTHORIZATION_DB_PASSWORD is required}
      ACADEMIC_DB_PASSWORD: ${ACADEMIC_DB_PASSWORD:?ACADEMIC_DB_PASSWORD is required}
      SCHEDULING_DB_PASSWORD: ${SCHEDULING_DB_PASSWORD:?SCHEDULING_DB_PASSWORD is required}
      ATTENDANCE_DB_PASSWORD: ${ATTENDANCE_DB_PASSWORD:?ATTENDANCE_DB_PASSWORD is required}
      CONFIGURATION_DB_PASSWORD: ${CONFIGURATION_DB_PASSWORD:?CONFIGURATION_DB_PASSWORD is required}
      QUALITY_DB_PASSWORD: ${QUALITY_DB_PASSWORD:?QUALITY_DB_PASSWORD is required}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD is required}
    volumes:
      - ./scripts:/scripts:ro
    command: ["bash", "/scripts/create-service-logins.sh"]
    networks:
      - fae-data

  mongodb:
    image: mongo:7@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4
    container_name: fae-mongo
    mem_limit: 1536m
    cpus: "1.0"
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-faceattend_biometric}
    command: ["mongod", "--auth"]
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - fae-data
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u $${MONGO_INITDB_ROOT_USERNAME} -p $${MONGO_INITDB_ROOT_PASSWORD} --eval \"db.adminCommand('ping')\" --quiet || mongosh --eval \"db.adminCommand('ping')\" --quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    image: cgr.dev/chainguard/minio@sha256:e234321fd3abff7fb968b0674056e883b702aa1ad93a0d4d795cb6c21fa46407
    container_name: fae-minio
    mem_limit: 512m
    cpus: "0.5"
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?MINIO_KMS_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    networks:
      - fae-data

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    container_name: fae-redis
    mem_limit: 128m
    cpus: "0.5"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - fae-data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  fae-data:
    external: true
    name: fae-data

volumes:
  postgres_data:
  mongo_data:
  minio_data:
  redis_data:
